      enum: [CREATED, STATUS, UPDATED, ASSIGNEE_ADDED, ASSIGNEE_REMOVED, LABEL_ADDED, LABEL_REMOVED, OWNER_ADDED, OWNER_REMOVED,
             CHECKLIST_ADDED, CHECKLIST_CHECKED, CHECKLIST_UNCHECKED, CHECKLIST_RENAMED, CHECKLIST_ASSIGNED, CHECKLIST_UNASSIGNED, CHECKLIST_REMOVED,
             COMMENTED, ATTACHMENT_ADDED, ATTACHMENT_REMOVED, SUBTASK_ADDED]
    TaskEvent:
      type: object
      required: [id, kind, field, from, to, subject, actor, createdAt]
      properties:
        id: { type: string }
        kind: { $ref: "#/components/schemas/TaskEventKind" }
        field: { type: [string, "null"], description: "For UPDATED: title, description, priority, client, startDate, endDate, dueDate" }
        from: { type: [string, "null"] }
        to: { type: [string, "null"] }
        subject: { type: [string, "null"], description: "Person, label, checklist item, file or subtask the event is about" }
        actor:
          description: null when the person is no longer a member ("a former member")
