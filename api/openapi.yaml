openapi: 3.1.0
info:
  title: List API
  version: 0.1.0
  description: |
    Contract-first API (ADR-0002). This file is the source of truth: change it
    before changing handlers or client code. CI rejects breaking changes.
    All errors are RFC 7807 `application/problem+json`.
servers:
  - url: /
tags:
  - name: system
    description: Liveness, readiness and service identity.
  - name: auth
    description: Sign-in (Google OIDC, or the dev provider outside prod), session, sign-out (ADR-0008, ADR-0017).
  - name: workspaces
    description: Tenancy - create, join, switch, members, invite code.
  - name: tasks
    description: Action items in the active workspace (E4). Mutations need the manage permission (E5-S1).
  - name: labels
    description: Workspace labels (E8-S2).
security:
  - sessionCookie: []
paths:
  /healthz:
    get:
      tags: [system]
      operationId: getHealth
      security: []
      summary: Liveness probe
      description: 200 while the process is serving HTTP. Never checks dependencies.
      responses:
        "200":
          description: Alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /readyz:
    get:
      tags: [system]
      operationId: getReadiness
      security: []
      summary: Readiness probe
      description: 200 when every dependency check passes, otherwise 503.
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "503":
          description: Not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
  /api/v1/system/info:
    get:
      tags: [system]
      operationId: getSystemInfo
      security: []
      summary: Service identity
      responses:
        "200":
          description: Service name, version and start time
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemInfo"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/auth/google/login:
    get:
      tags: [auth]
      operationId: startLogin
      summary: Start sign-in (browser navigation)
      security: []
      parameters:
        - name: returnTo
          in: query
          description: Same-site path to return to after sign-in (must start with "/", not "//").
          schema: { type: string }
      responses:
        "302":
          description: Redirect to the identity provider; sets the short-lived `oauth_flow` cookie.
  /api/v1/auth/google/callback:
    get:
      tags: [auth]
      operationId: completeLogin
      summary: OAuth callback (browser navigation)
      security: []
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
      responses:
        "302":
          description: |
            Success - sets `sid` and redirects to `returnTo` (or `/`).
            Failure - redirects to `/login?error=state|denied|oauth|internal`.
  /api/v1/auth/dev/authorize:
    get:
      tags: [auth]
      operationId: devAuthorizeForm
      summary: Dev identity provider form (only when AUTH_PROVIDER=dev; never in prod)
      x-dev-only: true
      security: []
      parameters:
        - { name: state, in: query, required: true, schema: { type: string } }
        - { name: nonce, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: HTML form
          content:
            text/html:
              schema: { type: string }
    post:
      tags: [auth]
      operationId: devAuthorizeSubmit
      summary: Dev identity provider submit (form post)
      x-dev-only: true
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [state, nonce, name, email]
              properties:
                state: { type: string }
                nonce: { type: string }
                name: { type: string }
                email: { type: string }
                deny: { type: string }
      responses:
        "302":
          description: Redirect to the callback with a signed code (or error=access_denied).
  /api/v1/auth/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: Current user
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeResponse" }
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Sign out (revokes the session)
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "204":
          description: Signed out; `sid` cleared.
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/workspaces:
    get:
      tags: [workspaces]
      operationId: listWorkspaces
      summary: My workspaces and the active one
      responses:
        "200":
          description: Workspaces
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceList" }
        default:
          $ref: "#/components/responses/Problem"
    post:
      tags: [workspaces]
      operationId: createWorkspace
      summary: Create a workspace (caller becomes OWNER; it becomes active)
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateWorkspaceRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceResponse" }
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/workspaces/join:
    post:
      tags: [workspaces]
      operationId: joinWorkspace
      summary: Join by invite code (idempotent; it becomes active)
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JoinWorkspaceRequest" }
      responses:
        "200":
          description: Joined
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceResponse" }
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/workspaces/switch:
    post:
      tags: [workspaces]
      operationId: switchWorkspace
      summary: Make one of my workspaces active
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SwitchWorkspaceRequest" }
      responses:
        "200":
          description: Switched
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceResponse" }
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/workspaces/current/members:
    get:
      tags: [workspaces]
      operationId: listMembers
      summary: Members of the active workspace
      responses:
        "200":
          description: Members
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberList" }
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/workspaces/current/invite-code/rotate:
    post:
      tags: [workspaces]
      operationId: rotateInviteCode
      summary: Replace the invite code (OWNER only)
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "200":
          description: New code
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InviteCodeResponse" }
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/tasks:
    get:
      tags: [tasks]
      operationId: listTasks
      summary: Tasks in the active workspace (filtered; no pagination - see A2)
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/TaskStatus" } }
        - { name: mine, in: query, description: "true = assigned to me (overrides assigneeId)", schema: { type: string, enum: ["true"] } }
        - { name: assigneeId, in: query, schema: { type: string } }
        - { name: labelId, in: query, schema: { type: string } }
      responses:
        "200":
          description: Tasks, due date first (no date last), then newest
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskList" }
        default:
          $ref: "#/components/responses/Problem"
    post:
      tags: [tasks]
      operationId: createTask
      summary: Create a task (caller becomes its creator)
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTaskRequest" }
      responses:
        "201":
          description: Created
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskResponse" }
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/tasks/{taskId}:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    get:
      tags: [tasks]
      operationId: getTask
      summary: One task with the caller's permissions
      responses:
        "200":
          description: Task
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskResponse" }
        default:
          $ref: "#/components/responses/Problem"
    patch:
      tags: [tasks]
      operationId: updateTask
      summary: Change fields (only those present). Optimistic concurrency via If-Match.
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateTaskRequest" }
      responses:
        "200":
          description: Updated
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskResponse" }
        default:
          $ref: "#/components/responses/Problem"
    delete:
      tags: [tasks]
      operationId: deleteTask
      summary: Delete a task
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "204":
          description: Deleted
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/tasks/{taskId}/assignees:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    put:
      tags: [tasks]
      operationId: setTaskAssignees
      summary: Replace assignees (workspace members only)
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserIdsRequest" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskResponse" }
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/tasks/{taskId}/owners:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    put:
      tags: [tasks]
      operationId: setTaskOwners
      summary: Replace owners (creator only; the creator is never listed as an owner)
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserIdsRequest" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskResponse" }
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/tasks/{taskId}/labels:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    put:
      tags: [tasks]
      operationId: setTaskLabels
      summary: Replace labels (labels of this workspace only)
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LabelIdsRequest" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskResponse" }
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/labels:
    get:
      tags: [labels]
      operationId: listLabels
      summary: Labels of the active workspace
      responses:
        "200":
          description: Labels, alphabetical
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LabelList" }
        default:
          $ref: "#/components/responses/Problem"
    post:
      tags: [labels]
      operationId: createLabel
      summary: Create a label (any member)
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateLabelRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LabelResponse" }
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/labels/{labelId}:
    delete:
      tags: [labels]
      operationId: deleteLabel
      summary: Delete a label (workspace OWNER only; removed from all tasks)
      parameters:
        - { name: labelId, in: path, required: true, schema: { type: string } }
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "204":
          description: Deleted
        default:
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: sid
  headers:
    ETag:
      description: 'Task version, e.g. "3". Send it back in If-Match.'
      schema: { type: string }
  parameters:
    TaskId:
      name: taskId
      in: path
      required: true
      schema: { type: string }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: The ETag you edited from. A stale value returns 409 conflict; a missing one 428.
      schema: { type: string }
    CsrfHeader:
      name: X-Requested-With
      in: header
      required: true
      description: Must be "app" on every unsafe request (CSRF defence, ADR-0008).
      schema:
        type: string
        enum: [app]
  responses:
    Problem:
      description: Error
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    Readiness:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        checks:
          type: object
          additionalProperties:
            type: string
            description: '"ok", "not_configured", or an error summary'
    SystemInfo:
      type: object
      required: [service, version, startedAt]
      properties:
        service:
          type: string
          example: list-api
        version:
          type: string
          example: 0.1.0
        startedAt:
          type: string
          format: date-time
    Role:
      type: string
      enum: [OWNER, MEMBER]
    User:
      type: object
      required: [id, name, email, image]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        image: { type: [string, "null"] }
    MeResponse:
      type: object
      required: [user]
      properties:
        user: { $ref: "#/components/schemas/User" }
    Workspace:
      type: object
      required: [id, name, role]
      properties:
        id: { type: string }
        name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
    ActiveWorkspace:
      type: object
      required: [id, name, role, inviteCode]
      properties:
        id: { type: string }
        name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        inviteCode: { type: string }
    WorkspaceList:
      type: object
      required: [workspaces, active]
      properties:
        workspaces:
          type: array
          items: { $ref: "#/components/schemas/Workspace" }
        active:
          anyOf:
            - { $ref: "#/components/schemas/ActiveWorkspace" }
            - { type: "null" }
    WorkspaceResponse:
      type: object
      required: [workspace]
      properties:
        workspace: { $ref: "#/components/schemas/Workspace" }
    CreateWorkspaceRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
    JoinWorkspaceRequest:
      type: object
      required: [inviteCode]
      properties:
        inviteCode: { type: string, minLength: 1 }
    SwitchWorkspaceRequest:
      type: object
      required: [workspaceId]
      properties:
        workspaceId: { type: string }
    Member:
      type: object
      required: [id, name, email, image, role, joinedAt]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        image: { type: [string, "null"] }
        role: { $ref: "#/components/schemas/Role" }
        joinedAt: { type: string, format: date-time }
    MemberList:
      type: object
      required: [members]
      properties:
        members:
          type: array
          items: { $ref: "#/components/schemas/Member" }
    InviteCodeResponse:
      type: object
      required: [inviteCode]
      properties:
        inviteCode: { type: string }
    TaskStatus:
      type: string
      enum: [BACKLOG, TODO, IN_PROGRESS, TESTING, DONE, CANCELED]
    TaskPriority:
      type: string
      enum: [URGENT, HIGH, MEDIUM, LOW, NONE]
    LabelColor:
      type: string
      enum: [gray, red, orange, yellow, green, teal, blue, purple, pink]
    PersonRef:
      type: object
      required: [id, name, image]
      properties:
        id: { type: string }
        name: { type: string }
        image: { type: [string, "null"] }
    Label:
      type: object
      required: [id, name, color]
      properties:
        id: { type: string }
        name: { type: string }
        color: { $ref: "#/components/schemas/LabelColor" }
    TaskViewer:
      type: object
      description: The caller's permissions on this task (E5-S1).
      required: [canManage, canManageOwners, isAssignee]
      properties:
        canManage: { type: boolean }
        canManageOwners: { type: boolean }
        isAssignee: { type: boolean }
    TaskSummary:
      type: object
      required: [id, title, status, priority, startDate, endDate, dueDate, assignees, labels, createdBy, version, updatedAt]
      properties:
        id: { type: string }
        title: { type: string }
        status: { $ref: "#/components/schemas/TaskStatus" }
        priority: { $ref: "#/components/schemas/TaskPriority" }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        dueDate: { type: [string, "null"], format: date }
        assignees:
          type: array
          items: { $ref: "#/components/schemas/PersonRef" }
        labels:
          type: array
          items: { $ref: "#/components/schemas/Label" }
        createdBy: { $ref: "#/components/schemas/PersonRef" }
        version: { type: integer }
        updatedAt: { type: string, format: date-time }
    Task:
      type: object
      required: [id, title, description, status, priority, startDate, endDate, dueDate, assignees, owners, labels, createdBy, createdAt, updatedAt, version, viewer]
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: [string, "null"] }
        status: { $ref: "#/components/schemas/TaskStatus" }
        priority: { $ref: "#/components/schemas/TaskPriority" }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        dueDate: { type: [string, "null"], format: date }
        assignees:
          type: array
          items: { $ref: "#/components/schemas/PersonRef" }
        owners:
          type: array
          items: { $ref: "#/components/schemas/PersonRef" }
        labels:
          type: array
          items: { $ref: "#/components/schemas/Label" }
        createdBy: { $ref: "#/components/schemas/PersonRef" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer }
        viewer: { $ref: "#/components/schemas/TaskViewer" }
    TaskList:
      type: object
      required: [tasks]
      properties:
        tasks:
          type: array
          items: { $ref: "#/components/schemas/TaskSummary" }
    TaskResponse:
      type: object
      required: [task]
      properties:
        task: { $ref: "#/components/schemas/Task" }
    CreateTaskRequest:
      type: object
      required: [title, startDate, endDate]
      properties:
        title: { type: string, minLength: 1, maxLength: 500 }
        description: { type: [string, "null"] }
        status: { $ref: "#/components/schemas/TaskStatus" }
        priority: { $ref: "#/components/schemas/TaskPriority" }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        dueDate: { type: [string, "null"], format: date }
        assigneeIds:
          type: array
          items: { type: string }
        labelIds:
          type: array
          items: { type: string }
    UpdateTaskRequest:
      type: object
      description: Only the fields present are changed.
      properties:
        title: { type: string, minLength: 1, maxLength: 500 }
        description: { type: [string, "null"] }
        status: { $ref: "#/components/schemas/TaskStatus" }
        priority: { $ref: "#/components/schemas/TaskPriority" }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        dueDate: { type: [string, "null"], format: date }
    UserIdsRequest:
      type: object
      required: [userIds]
      properties:
        userIds:
          type: array
          items: { type: string }
    LabelIdsRequest:
      type: object
      required: [labelIds]
      properties:
        labelIds:
          type: array
          items: { type: string }
    LabelList:
      type: object
      required: [labels]
      properties:
        labels:
          type: array
          items: { $ref: "#/components/schemas/Label" }
    LabelResponse:
      type: object
      required: [label]
      properties:
        label: { $ref: "#/components/schemas/Label" }
    CreateLabelRequest:
      type: object
      required: [name, color]
      properties:
        name: { type: string, minLength: 1, maxLength: 40 }
        color: { $ref: "#/components/schemas/LabelColor" }
    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string
    Problem:
      type: object
      description: RFC 7807 problem details.
      required: [type, title, status]
      properties:
        type:
          type: string
          description: Machine-readable problem type, e.g. "not_found", "validation".
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        requestId:
          type: string
        errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
