        email: { type: [string, "null"] }
        phone: { type: [string, "null"] }
        color: { $ref: "#/components/schemas/LabelColor" }
        notes: { type: [string, "null"] }
    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string
    Problem:
      type: object
      description: RFC 7807 problem details.
      required: [type, title, status]
      properties:
        type:
          type: string
          description: Machine-readable problem type, e.g. "not_found", "validation".
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        requestId:
          type: string
        errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
