        endDate: { type: string, format: date }
        dueDate: { type: [string, "null"], format: date }
        assignees:
          type: array
          items: { $ref: "#/components/schemas/PersonRef" }
        labels:
          type: array
          items: { $ref: "#/components/schemas/Label" }
        createdBy: { $ref: "#/components/schemas/PersonRef" }
        version: { type: integer }
        updatedAt: { type: string, format: date-time }
        client:
          anyOf:
            - { $ref: "#/components/schemas/ClientRef" }
            - { type: "null" }
        parent:
          anyOf:
            - { $ref: "#/components/schemas/TaskRef" }
            - { type: "null" }
        counts: { $ref: "#/components/schemas/TaskCounts" }
    Task:
      type: object
      required: [id, title, description, status, priority, startDate, endDate, dueDate, assignees, owners, labels, createdBy, createdAt, updatedAt, version, viewer, client, parent, subtasks, checklist, comments, attachments]
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: [string, "null"] }
        status: { $ref: "#/components/schemas/TaskStatus" }
        priority: { $ref: "#/components/schemas/TaskPriority" }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        dueDate: { type: [string, "null"], format: date }
        assignees:
          type: array
          items: { $ref: "#/components/schemas/PersonRef" }
        owners:
          type: array
          items: { $ref: "#/components/schemas/PersonRef" }
        labels:
          type: array
          items: { $ref: "#/components/schemas/Label" }
        createdBy: { $ref: "#/components/schemas/PersonRef" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer }
        viewer: { $ref: "#/components/schemas/TaskViewer" }
        client:
          anyOf:
            - { $ref: "#/components/schemas/ClientRef" }
            - { type: "null" }
        parent:
          anyOf:
            - { $ref: "#/components/schemas/TaskRef" }
